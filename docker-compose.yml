services:
  db:
    image: postgres:18-alpine
    container_name: cocktail_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: cocktails_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  web:
    build: .
    container_name: btc_terminal
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - db # Обычное ожидание старта контейнера, без жестких проверок
    volumes:
      - ./uploads:/app/uploads

volumes:
  postgres_data: