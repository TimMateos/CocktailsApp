<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой бар - Инвентарь</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body { background-color: #0b0b12; color: #00ffcc; font-family: 'Press Start 2P', cursive; font-size: 12px; line-height: 1.6; }
        h2 { color: #ff007f; font-size: 24px; line-height: 1.5; margin-bottom: 0; text-transform: uppercase; text-shadow: 4px 4px 0px rgba(255, 0, 127, 0.3); }
        .card { background-color: #151525; border: 2px solid #ff007f; border-radius: 0; box-shadow: 6px 6px 0px rgba(255, 0, 127, 0.3); }
        .card-header { background-color: rgba(255, 0, 127, 0.05) !important; border-bottom: 2px solid #ff007f; padding: 15px; }
        .cyber-label { color: #ffcc00 !important; text-transform: uppercase; margin-bottom: 8px; font-size: 12px; display: block; }
        .form-control { background-color: #0b0b12; border: 2px solid #00ffcc; border-radius: 0; color: #00ffcc; font-family: 'Press Start 2P', cursive; font-size: 12px; padding: 14px; }
        .form-control:focus { background-color: #151525; color: #00ffcc; border-color: #ff007f; box-shadow: none; outline: 2px solid #ff007f; }
        .btn { border-radius: 0; font-family: 'Press Start 2P', cursive; font-size: 12px; padding: 12px 18px; text-transform: uppercase; box-shadow: 4px 4px 0px rgba(0, 0, 0, 0.5); }
        .btn-success { background-color: transparent; color: #00ffcc; border: 2px solid #00ffcc; }
        .btn-success:hover { background-color: #00ffcc; color: #0b0b12; box-shadow: 0 0 10px #00ffcc;}
        .btn-outline-danger { border-color: #ff007f; color: #ff007f; padding: 6px 10px; font-size: 10px; box-shadow: 2px 2px 0px rgba(0,0,0,0.5); }
        .btn-outline-danger:hover { background-color: #ff007f; color: #fff; }

        .inventory-grid { display: flex; flex-wrap: wrap; gap: 15px; margin-top: 20px; }

        /* Стили для активных элементов */
        .inventory-item { background-color: #0b0b12; border: 1px solid #00ffcc; padding: 10px 15px; display: flex; align-items: center; justify-content: space-between; gap: 15px; color: #00ffcc; min-width: 250px; }

        /* Стили для закончившихся ингредиентов */
        .inventory-item.out-of-stock { border-color: #4a4a6a; color: #4a4a6a; }

        .form-check-input { background-color: #0b0b12; border: 2px solid #ffcc00; border-radius: 0; width: 16px; height: 16px; margin-top: 0; cursor: pointer; }
        .form-check-input:checked { background-color: #ffcc00; border-color: #ffcc00; }
        .out-of-stock .form-check-input { border-color: #4a4a6a; } /* Тусклая галочка, когда нет в наличии */

        .nav-link { color: #4a4a6a; text-decoration: none; display: inline-block; margin-bottom: 20px; font-size: 10px; }
        .nav-link:hover { color: #ff007f; }
    </style>
</head>
<body>
<div class="container mt-5">
    <a href="/" class="nav-link">< RETURN_TO_MAIN_CATALOG</a>

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-4 mb-5">
        <h2>[STORAGE_MODULE]<br>MY BAR INVENTORY</h2>
    </div>

    <div class="card mb-5">
        <div class="card-header">
            <span class="cyber-label">> REGISTER NEW INGREDIENT</span>
        </div>
        <div class="card-body p-4">
            <form action="/inventory/add" method="POST" class="d-flex gap-3 flex-wrap">
                <input type="text" class="form-control" name="name" placeholder="> Enter ingredient name..." style="flex: 1; min-width: 250px;" required>
                <button type="submit" class="btn btn-success">STORE</button>
            </form>
        </div>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-2">
        <span class="cyber-label mb-0">> INGREDIENTS</span>
        <div class="d-flex gap-2">
            <form action="/inventory/toggle-all" method="POST" class="m-0">
                <input type="hidden" name="state" value="true">
                <button type="submit" class="btn btn-outline-info btn-sm" style="font-size: 10px; padding: 6px 10px;">> ENABLE_ALL</button>
            </form>
            <form action="/inventory/toggle-all" method="POST" class="m-0">
                <input type="hidden" name="state" value="false">
                <button type="submit" class="btn btn-outline-danger btn-sm" style="font-size: 10px; padding: 6px 10px;">> DISABLE_ALL</button>
            </form>
        </div>
    </div>
    <div class="inventory-grid">
        {{ if . }}
        {{ range . }}
        <div class="inventory-item {{ if not .InStock }}out-of-stock{{ end }}">

            <form action="/inventory/toggle" method="POST" class="m-0 p-0 d-flex align-items-center gap-3">
                <input type="hidden" name="id" value="{{ .ID }}">
                <input type="checkbox" class="form-check-input m-0" onchange="this.form.submit()" {{ if .InStock }}checked{{ end }}>
                <span>{{ .Name }}</span>
            </form>

            <form action="/inventory/delete" method="POST" class="m-0 p-0">
                <input type="hidden" name="id" value="{{ .ID }}">
                <button type="submit" class="btn btn-outline-danger btn-sm">DEL</button>
            </form>
        </div>
        {{ end }}
        {{ else }}
        <p style="color: #4a4a6a;">> STORAGE_IS_EMPTY</p>
        {{ end }}
    </div>
</div>
</body>
</html>
